    <style>
      @font-face { font-family: "Playfair"; src: url("assets/fonts/PlayfairDisplay.ttf") format("truetype"); font-weight: 400 900; font-style: normal; }
      @font-face { font-family: "Playfair"; src: url("assets/fonts/PlayfairDisplay-Italic.ttf") format("truetype"); font-weight: 400 900; font-style: italic; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/Montserrat.ttf") format("truetype"); font-weight: 100 900; }
      /* Burger Tokri: espresso, bronze and dusty rose, taken from the burgertokri.com hero */
      :root { --ground: #1d140e; --espresso: #2a180e; --bronze: #5e2f1a; --gold-1: #f7e3b5; --shade: 34, 22, 14; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .abs { position: absolute; }
      #vw { inset: 0; overflow: hidden; transform-origin: 53% 70%; }
      .media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

      /* the words lie on the pavement, inside the basket's footprint, so the basket hides them until it is lifted.
         multiply lets the pavement texture show through, as if printed on the ground */
      #ground { left: 0; top: 0; width: 1080px; height: 1920px; mix-blend-mode: multiply; opacity: 0; }
      #eyebrow { position: absolute; top: 1222px; left: 575px; transform: translateX(-50%); font-family: "Playfair"; font-style: italic; font-weight: 700; font-size: 48px; color: var(--bronze); white-space: nowrap; }
      .word { position: absolute; left: 575px; transform: translateX(-50%); font-family: "Playfair"; font-weight: 800; font-size: 104px; line-height: 1; letter-spacing: 0.04em; color: var(--espresso); white-space: nowrap; }
      #w1 { top: 1284px; }
      #w2 { top: 1392px; }

      #topshade { left: 0; right: 0; top: 0; height: 360px; background: linear-gradient(180deg, rgba(var(--shade), 0.35), rgba(var(--shade), 0)); }
      #frame { inset: 44px; border: 2px solid rgba(247, 227, 181, 0.6); border-radius: 26px; opacity: 0; }
      #url { bottom: 104px; left: 0; right: 0; text-align: center; font-family: "Montserrat"; font-weight: 600; font-size: 30px; letter-spacing: 0.26em; color: var(--espresso); opacity: 0; }
    </style>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });
      // slow push-in towards the spot where the basket sits
      tl.fromTo("#vw", { scale: 1.0 }, { scale: 1.1, duration: 3.8, ease: "sine.inOut" }, 0);
      tl.fromTo("#frame", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.1);
      // the words are switched on while the basket still covers them (1.9s in the source); the cut-out reveals them as it lifts
      tl.set("#ground", { opacity: 1 }, 1.57);
      tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
