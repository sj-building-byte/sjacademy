      <script>
        (function () {
          const BAR = 2.483187, BEAT = BAR / 4;
          const tl = gsap.timeline({ paused: true });

          // Bar 7: codes swap on the beat; the line holds under them.
          for (let i = 2; i <= 4; i++) {
            tl.set("#s3-t" + (i - 1), { attr: { opacity: 0 } }, (i - 1) * BEAT);

          for (let i = 1; i <= 4; i++) {
            tl.set("#s3-l" + i, { opacity: 1 }, (i - 1) * BEAT + 0.04);
            if (i < 4) tl.set("#s3-l" + i, { opacity: 0 }, i * BEAT);
          }
          tl.fromTo("#s3-codes", { scale: 1.06 }, { scale: 1, duration: BAR, ease: "power2.out" }, 0);
          tl.fromTo("#s3-k1", { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "expo.out" }, 0.2);
          tl.to("#s3-k1", { yPercent: -110, duration: 0.25, ease: "expo.in" }, BAR - 0.28);
          tl.to("#s3-l4", { opacity: 0, duration: 0.2, ease: "power1.in" }, BAR - 0.25);

          // Bar 8: the grid. "We teach them." The pen rings the flask.
          tl.set("#s3-grid", { opacity: 1 }, BAR);
          tl.fromTo("#s3-h1", { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "expo.out" }, BAR + 0.05);

          }
          tl.fromTo("#s3-ring", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "sine.inOut" }, BAR + 0.6);

          window.__timelines["s3-subjects"] = tl;
