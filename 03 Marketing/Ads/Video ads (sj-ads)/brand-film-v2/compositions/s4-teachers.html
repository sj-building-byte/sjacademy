      <script>
        (function () {
          const BAR = 2.483187;
          document.fonts.ready.then(function () {
            const tl = gsap.timeline({ paused: true });
            // Fit each giant name to the 880px safe width, measured once on a canvas (no reflow).
            const ctx = document.createElement("canvas").getContext("2d");
            ctx.font = "800 100px Poppins";
            for (let i = 0; i < 5; i++) {
              const el = document.getElementById("s4-n" + i);
              const w = ctx.measureText(el.textContent).width * 0.96; // letter-spacing -0.04em
              el.style.fontSize = Math.min(380, Math.floor(100 * 860 / w)) + "px";
            }

            tl.fromTo("#s4-brow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.2);
            for (let i = 0; i < 5; i++) {
              const t0 = i * BAR;
              // each teacher's layers (footage, dim, name, cutout) only show in their own bar
              tl.set("#s4-cam" + i, { opacity: 1 }, t0 + 0.001);
              if (i < 4) tl.set("#s4-cam" + i, { opacity: 0 }, t0 + BAR - 0.001);
              tl.set("#s4-t" + i, { opacity: 1 }, t0 + 0.001);
              if (i < 4) tl.set("#s4-t" + i, { opacity: 0 }, t0 + BAR - 0.001);
              tl.fromTo("#s4-cam" + i, { scale: 1 }, { scale: 1.05, duration: BAR, ease: "none" }, t0);
              // the name rises behind the teacher, the tag rises below
              tl.fromTo("#s4-n" + i, { opacity: 0, yPercent: 30 }, { opacity: 1, yPercent: 0, duration: 0.5, ease: "expo.out" }, t0 + 0.12);
              tl.fromTo("#s4-w" + i, { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "expo.out" }, t0 + 0.3);
              tl.fromTo("#s4-s" + i, { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "expo.out" }, t0 + 0.4);
              if (i < 4) {
                tl.to("#s4-n" + i, { opacity: 0, duration: 0.2, ease: "expo.in" }, t0 + BAR - 0.2);
                tl.to(["#s4-w" + i, "#s4-s" + i], { yPercent: -110, duration: 0.22, ease: "expo.in" }, t0 + BAR - 0.24);
              }
            }
            window.__timelines["s4-teachers"] = tl;
          });
        })();
