      <script>
        (function () {
          const BAR = 2.483187;
          const tl = gsap.timeline({ paused: true });
          const up = (sel, at) => tl.fromTo(sel, { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "expo.out" }, at);
          const out = (sel, at) => tl.to(sel, { yPercent: -110, duration: 0.25, ease: "expo.in" }, at);

          // Each text block is only visible in its own bar.
          [["#s2-hA", 0, BAR], ["#s2-B", BAR, 2 * BAR], ["#s2-Bs", BAR, 2 * BAR], ["#s2-C", 2 * BAR, 3 * BAR], ["#s2-hD", 3 * BAR, 9.94]].forEach(([s, a, b]) => {
            tl.set(s, { opacity: 1 }, a + 0.001);
            if (b < 9.9) tl.set(s, { opacity: 0 }, b - 0.001);
          });
          // Bar 3: a small window on canvas. "Two ways to study."
          tl.fromTo("#s2-win", { scale: 0.42, y: 200, opacity: 0, borderRadius: 96 }, { scale: 0.5, y: 190, opacity: 1, borderRadius: 80, duration: 0.6, ease: "expo.out" }, 0);
          up("#s2-a1", 0.12); up("#s2-a2", 0.2);
          out(["#s2-a1", "#s2-a2"], BAR - 0.3);

          // Bar 4: the window opens to full bleed on the downbeat. "In class."
          tl.to("#s2-win", { scale: 1, y: 0, borderRadius: 0, duration: 0.75, ease: "power3.inOut" }, BAR);
          tl.to("#s2-scrimB", { opacity: 1, duration: 0.4, ease: "power1.out" }, BAR + 0.45);
          up("#s2-b1", BAR + 0.55); up("#s2-b2", BAR + 0.68);
          out(["#s2-b1", "#s2-b2"], 2 * BAR - 0.28);

          // Bar 5: the window shrinks and flies onto the projector in Sir Abdullah's online class.
          tl.to("#s2-win", { scale: 0.5, x: -220, y: -400, borderRadius: 48, duration: 0.9, ease: "power3.inOut" }, 2 * BAR);
          tl.to("#s2-win", { opacity: 0, duration: 0.35, ease: "power1.in" }, 2 * BAR + 0.9);
          up("#s2-c1", 2 * BAR + 0.95);
          out("#s2-c1", 3 * BAR - 0.28);
          tl.to("#s2-scrimB", { opacity: 0, duration: 0.25, ease: "power1.in" }, 3 * BAR - 0.28);

          // Bar 6: ink ground, four live online teachers.
          tl.set("#s2-ink", { opacity: 1 }, 3 * BAR);
          up("#s2-d1", 3 * BAR + 0.05); up("#s2-d2", 3 * BAR + 0.13);
          tl.fromTo("#s2-hl", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 3 * BAR + 0.75);
          tl.fromTo("#s2-nr", { color: "#F7F5EF" }, { color: "#151515", duration: 0.3, ease: "power2.out" }, 3 * BAR + 0.75);
          ["#s2-g1", "#s2-g2", "#s2-g3", "#s2-g4"].forEach((c, i) => {
            tl.fromTo(c, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 3 * BAR + 0.1 + i * 0.07);
          });

          window.__timelines["s2-sizes"] = tl;
        })();
