    <div id="cap0" class="clip cap" data-start="0.300" data-duration="1.563" data-track-index="1"><span id="cap0-t">Ten maths hacks your calculator</span></div>

    <div id="cap2" class="clip cap" data-start="4.925" data-duration="1.270" data-track-index="1"><span id="cap2-t">To multiply by eleven, put</span></div>
