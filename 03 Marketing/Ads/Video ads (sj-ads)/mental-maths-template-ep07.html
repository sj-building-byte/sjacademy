<html lang="en" data-resolution="portrait">
  <head>

    <style>

      :root { --yellow: #FCE004; --ink: #151515; --canvas: #F7F5EF; --note: #B54200; --grey: #6a6a6a; --pen: #D63A2F; }

      .mask > span { display: block; }
      .hlw { position: relative; z-index: 0; isolation: isolate; display: inline-block; }

      #logo { top: 244px; left: 100px; width: 290px; opacity: 0; }
      #tag { top: 250px; right: 100px; font-size: 26px; font-weight: 600; background: var(--ink); color: #fff; padding: 8px 20px; border-radius: 999px; opacity: 0; }

      #hr .a { font-size: 80px; }

      /* the question, typeset big: each digit in its own fixed box so the pen marks line up */
      #hero { top: 600px; left: 255px; height: 300px; display: flex; align-items: flex-start; }

      #hero .dg + .dg { margin-left: 40px; }
      #hero .sq { width: 130px; height: 150px; margin-top: 34px; overflow: hidden; }
      #hero .sq > span { display: block; font-size: 140px; font-weight: 700; line-height: 150px; color: var(--pen); }
      #ink { top: 0; left: 0; width: 1080px; height: 1920px; overflow: visible; pointer-events: none; }

      #findx { top: 952px; left: 60px; right: 60px; text-align: center; font-size: 66px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
      #hint { top: 1170px; left: 726px; font-family: "Caveat", cursive; font-weight: 600; font-size: 56px; color: var(--note); opacity: 0; line-height: 1.0; }

      #timer { top: 1100px; left: 0; right: 0; display: flex; justify-content: center; }
      #tbox { position: relative; width: 290px; height: 290px; border-radius: 50%; background: var(--ink); opacity: 0; }
      #tbox svg { position: absolute; inset: 0; width: 290px; height: 290px; transform: rotate(-90deg); }
      #tnum { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 132px; font-weight: 700; letter-spacing: -0.04em; }
      #tup { top: 1200px; left: 0; right: 0; display: flex; justify-content: center; }
      #tup span { background: var(--pen); color: #fff; font-size: 54px; font-weight: 700; padding: 14px 40px; border-radius: 18px; opacity: 0; display: block; }

      /* the trick as two joined tiles: [4 × 5][25] */
      .tile { top: 1004px; height: 168px; display: flex; align-items: center; justify-content: center; font-size: 104px; font-weight: 700; letter-spacing: -0.03em; opacity: 0; }
      #tl { left: 175px; width: 360px; background: var(--ink); color: var(--yellow); border-radius: 30px 0 0 30px; box-shadow: 0 24px 50px rgba(21,21,21,0.22); }

      #nl { left: 175px; width: 360px; }

      #steps { top: 1290px; left: 150px; right: 100px; counter-reset: st; }
      .stp { font-size: 42px; font-weight: 600; line-height: 1.5; padding-bottom: 6px; counter-increment: st; }
      .stp > span { display: flex !important; align-items: center; gap: 22px; }

      #e-logo { top: 270px; left: 0; right: 0; display: flex; justify-content: center; }
      #e-logo img { width: 520px; opacity: 0; }

      #e-pill span { background: var(--ink); color: var(--yellow); font-size: 54px; font-weight: 600; padding: 20px 50px; border-radius: 999px; opacity: 0; display: block; }
      #e-ans { top: 1080px; left: 0; right: 0; display: flex; justify-content: center; }
      #e-ans-c { background: #fff; border-radius: 30px; padding: 26px 56px 30px; text-align: center; box-shadow: 0 30px 70px rgba(21,21,21,0.18); opacity: 0; }
      #e-ans .k { font-size: 30px; font-weight: 600; color: var(--grey); }

      #e-handle { top: 1530px; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 600; opacity: 0; }

      <audio id="fx-s2" src="assets/sfx/sj-sfx-pen-tick.wav" data-start="11.2" data-duration="0.08" data-track-index="11" data-volume="0.45"></audio>

      <audio id="fx-r0" src="assets/sfx/fx-pop.wav" data-start="13.75" data-duration="0.09" data-track-index="13" data-volume="0.35"></audio>
      <audio id="fx-r1" src="assets/sfx/fx-pop.wav" data-start="14.1" data-duration="0.09" data-track-index="13" data-volume="0.35"></audio>

      <div id="s1" class="clip ruled" data-start="0" data-duration="17" data-track-index="1">
        <img id="logo" class="abs" src="assets/brand/sj-academy-logo-horizontal-on-light.svg" alt="SJ Academy">
        <div id="tag" class="abs">Solve it in your head · <b>#{{NUM}}</b></div>

        <div class="head abs" id="hq">
          <div class="mask a"><span id="hq1">5 seconds.</span></div>
          <div class="mask b"><span id="hq2">No pen. No calculator.</span></div>

        <svg id="ink" class="abs" viewBox="0 0 1080 1920" data-layout-allow-overflow>
          <!-- pen loop round the 4, then arrows down into the tiles -->
          <path id="r1" d="M 339.8 612.1 L 356.0 610.0 L 371.8 610.5 L 386.9 613.8 L 401.1 619.6 L 414.2 628.0 L 426.3 638.7 L 437.3 651.6 L 447.0 666.3 L 455.4 682.7 L 462.4 700.4 L 467.8 719.0 L 471.2 738.3 L 472.6 757.7 L 471.6 777.0 L 468.1 795.8 L 462.0 813.7 L 453.4 830.3 L 442.5 845.3 L 429.5 858.5 L 414.9 869.5 L 399.2 878.2 L 382.9 884.4 L 366.3 887.9 L 350.0 888.7 L 334.2 886.7 L 319.2 882.1 L 305.3 874.8 L 292.4 865.1 L 280.6 853.0 L 270.1 838.9 L 260.8 823.0 L 252.9 805.6 L 246.6 787.1 L 242.1 767.8 L 239.7 748.0 L 239.5 728.2 L 241.8 708.8 L 246.7 690.1 L 254.2 672.5 L 264.2 656.3 L 276.3 641.9 L 290.4 629.6 L 305.9 619.5 L 322.2 611.9 L 339.1 607.0 L 355.9 604.8 L 372.2 605.4 L 387.9 608.7" fill="none" stroke="#D63A2F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/>
          <path id="r2" d="M 356 904 L 357 984 M 334 960 L 357 986 L 380 960" fill="none" stroke="#D63A2F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/>
          <path id="r3" d="M 612 878 Q 692 898 702 982 M 676 964 L 703 986 L 722 958" fill="none" stroke="#D63A2F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/>

    <script>
      const tl = gsap.timeline({ paused: true });
      const ENTER = "expo.out", EXIT = "expo.in";
      const maskUp = (sel, t, d = 0.45) => tl.fromTo(sel, { yPercent: 115 }, { yPercent: 0, duration: d, ease: ENTER }, t);
      const maskOut = (sel, t) => tl.to(sel, { yPercent: -115, duration: 0.3, ease: EXIT }, t);
      const swipe = (sel, t, d = 0.3) => tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.out" }, t);
      const pen = (sel, t, d) => tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "sine.inOut" }, t);
      const pop = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, t);
      const stamp = (sel, t, rot) => {
        tl.fromTo(sel, { scale: 1.35, opacity: 0, rotation: rot }, { scale: 1, opacity: 1, duration: 0.14, ease: "back.out(1.7)" }, t);
        tl.fromTo(sel, { x: -3 }, { x: 3, duration: 0.033, repeat: 3, yoyo: true, ease: "none" }, t + 0.14);
        tl.to(sel, { x: 0, duration: 0.01 }, t + 0.28);
      };

      // the question: 45² written big, then the line under it
      tl.fromTo("#logo", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.4, ease: ENTER }, 0);
      tl.fromTo("#tag", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.4, ease: ENTER }, 0.05);
      maskUp("#hq1", 0.0);
      maskUp("#hq2", 0.15);
      tl.set(["#hr1", "#hr2", "#st0", "#st1", "#st2"], { yPercent: 115 }, 0);
      tl.set(["#hr", "#steps"], { opacity: 0 }, 0);
      maskUp("#d1", 0.3, 0.55);
      maskUp("#d2", 0.45, 0.55);
      maskUp("#d3", 0.75, 0.5);
      maskUp("#fx", 1.3);

      // five seconds
      tl.fromTo("#tbox", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, 1.85);
      tl.fromTo("#ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: 5, ease: "none" }, 2.2);
      const clock = { v: 5 };
      tl.fromTo(clock, { v: 5 }, { v: 0, duration: 5, ease: "none", onUpdate: () => { document.getElementById("tnum").textContent = Math.ceil(clock.v - 1e-6); } }, 2.2);
      for (let i = 0; i < 5; i++) tl.fromTo("#tnum", { scale: 1.18 }, { scale: 1, duration: 0.3, ease: "power2.out" }, 2.2 + i);
      tl.to("#ring", { stroke: "#D63A2F", duration: 0.2 }, 4.2);
      tl.fromTo("#hint", { opacity: 0, rotation: -12, scale: 0.9 }, { opacity: 1, rotation: -5, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, 4.2);
      tl.fromTo("#hero", { scale: 1 }, { scale: 1.03, duration: 0.5, repeat: 9, yoyo: true, ease: "sine.inOut", transformOrigin: "50% 50%" }, 2.2);
