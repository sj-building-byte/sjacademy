<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJ Mapper Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>SJ Academy's Ultimate <span class="highlight-yellow">University Subject Mapper</span></h1>
        <p class="subheading">Find your exact O/A Level path to LUMS, NUST, and IBA.</p>
        <div class="form-group">
            <label for="university">University:</label>
            <select id="university" name="university">
                <option value="">Select University</option>
            </select>
        </div>
        <div class="form-group">
            <label for="program">Program:</label>
            <select id="program" name="program">
                <option value="">Select Program</option>
            </select>
        </div>
        <button id="showRequirementsBtn">Show Requirements</button>
        <div id="requirementsDisplay" class="requirements-display" style="display: none;">
            <h2>Requirements</h2>
            <div id="requirementsContent"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
