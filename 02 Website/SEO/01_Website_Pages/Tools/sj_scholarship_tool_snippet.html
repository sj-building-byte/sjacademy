  /* BULLETPROOF SVG SIZING */

  /* Full Criteria Table - Optimized to never scroll on mobile */
  .scholarship-tool .criteria-table-wrapper {

  /* Pro Tips / Alert Box */

  /* BULLETPROOF SVG SIZING FOR PRO TIPS */

<div class="scholarship-tool">
  <div class="header-section">
    <div class="mode-badge-wrap">
      <div class="mode-badge">
        <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2.12-1.15L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
        Scholarships
      </div>
    </div>
    <h2>A Level Scholarships in <span class="highlight">Pakistan</span></h2>
    <p class="subtitle">Enter your O-Level grades to instantly check your eligibility at top A-Level colleges.</p>
  </div>

  <div class="filters-grid">
    <div class="filter-group">
      <label for="citySelect">Select City</label>
      <select id="citySelect" onchange="loadColleges()">
        <option value="">All Cities</option>
        <option value="Karachi">Karachi</option>
        <option value="Lahore">Lahore</option>
        <option value="Islamabad/Rawalpindi">Islamabad / Rawalpindi</option>
        <option value="Other Cities">Other Cities (Faisalabad, Multan, Peshawar)</option>
      </select>
    </div>
    
    <div class="filter-group">
      <label id="collegeLabel" for="collegeSelect">Select College</label>
      <select id="collegeSelect" disabled>
        <option value="">-- Select City First --</option>
      </select>
    </div>
  </div>

  <div class="checkbox-wrapper">
    <input type="checkbox" id="internalStudent">
    <label for="internalStudent">I am already studying in this school network (Internal Student)</label>
  </div>

  <div class="filter-group" style="margin-bottom: 4px;">
    <label>Your O-Level Grades</label>
  </div>
  <div class="grades-grid">
    <div class="filter-group">
      <label>A*</label>
      <input type="number" id="g_astar" min="0" value="0">
    </div>
    <div class="filter-group">
      <label>A</label>
      <input type="number" id="g_a" min="0" value="0">
    </div>
    <div class="filter-group">
      <label>B</label>
      <input type="number" id="g_b" min="0" value="0">
    </div>
    <div class="filter-group">
      <label>C</label>
      <input type="number" id="g_c" min="0" value="0">
    </div>
    <div class="filter-group">
      <label>D</label>
      <input type="number" id="g_d" min="0" value="0">
    </div>
    <div class="filter-group">
      <label>E/U</label>
      <input type="number" id="g_u" min="0" value="0">
    </div>
  </div>

  <button class="check-btn" id="checkBtn" onclick="checkEligibility()" disabled>
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    Check Eligibility
  </button>

  <div id="resultsArea" class="results-container"></div>
</div>

<script>
  const sheetUrls = {
    "Karachi": "https://docs.google.com/spreadsheets/d/e/2PACX-1vRLdJGj74e5mPHPxuaZuWux5pBxX67X-DWKBnk5y1-CPX_T7N6RryAUVQGRORHSdPwvpDBGz8dpvmXu/pub?gid=2141230095&single=true&output=tsv",
    "Lahore": "https://docs.google.com/spreadsheets/d/e/2PACX-1vRLdJGj74e5mPHPxuaZuWux5pBxX67X-DWKBnk5y1-CPX_T7N6RryAUVQGRORHSdPwvpDBGz8dpvmXu/pub?gid=1760876306&single=true&output=tsv",
    "Islamabad/Rawalpindi": "https://docs.google.com/spreadsheets/d/e/2PACX-1vRLdJGj74e5mPHPxuaZuWux5pBxX67X-DWKBnk5y1-CPX_T7N6RryAUVQGRORHSdPwvpDBGz8dpvmXu/pub?gid=907956958&single=true&output=tsv",
    "Other Cities": "https://docs.google.com/spreadsheets/d/e/2PACX-1vRLdJGj74e5mPHPxuaZuWux5pBxX67X-DWKBnk5y1-CPX_T7N6RryAUVQGRORHSdPwvpDBGz8dpvmXu/pub?gid=1074505138&single=true&output=tsv"
  };

  let cityData = [];

  async function loadColleges() {
    const city = document.getElementById('citySelect').value;
    const collegeDropdown = document.getElementById('collegeSelect');
    const checkBtn = document.getElementById('checkBtn');
    const results = document.getElementById('resultsArea');
    const colLabel = document.getElementById('collegeLabel');

    collegeDropdown.innerHTML = '<option value="">-- Choose a College --</option>';
    collegeDropdown.disabled = true;
    checkBtn.disabled = true;
    results.style.display = 'none';

    if (!city) return;

    colLabel.textContent = "Loading...";

    try {
      const response = await fetch(sheetUrls[city]);
      let text = await response.text();
      text = text.replace(/\r/g, ''); 
      
      const rows = text.split('\n').map(row => row.split('\t'));
      const headers = rows[0];
      cityData = [];
      
      for(let i = 1; i < rows.length; i++) {
        if(rows[i].length < headers.length || !rows[i][0]) continue;
        let obj = {};
        for(let j = 0; j < headers.length; j++) {
          obj[headers[j]] = rows[i][j];
        }
        cityData.push(obj);
      }

      const uniqueColleges = [...new Set(cityData.map(item => item.College))];
      
      uniqueColleges.forEach(col => {
        let opt = document.createElement('option');
        opt.value = col;
        opt.textContent = col;
        collegeDropdown.appendChild(opt);
      });

      colLabel.textContent = "Select College";
      collegeDropdown.disabled = false;
      checkBtn.disabled = false;

    } catch (error) {
      console.error("Error loading TSV:", error);
      colLabel.textContent = "Error loading data.";
    }
  }

  function checkEligibility() {
    const college = document.getElementById('collegeSelect').value;
    if (!college) {
      alert("Please select a college.");
      return;
    }

    const isInternal = document.getElementById('internalStudent').checked;
    const aStar = parseInt(document.getElementById('g_astar').value) || 0;
    const a = parseInt(document.getElementById('g_a').value) || 0;
    const b = parseInt(document.getElementById('g_b').value) || 0;
    const c = parseInt(document.getElementById('g_c').value) || 0;
    const d = parseInt(document.getElementById('g_d').value) || 0;
    const u = parseInt(document.getElementById('g_u').value) || 0;
    
    const totalAs = aStar + a;
    const sicasPoints = (aStar * 10) + (a * 5);

    const rules = cityData.filter(r => r.College === college);
    let matchedQuant = null;
    let holisticNotes = [];
    let usesQuant = false;

    // ACADEMIC BASELINE FILTER: Prevent 5 U's from showing up as "Holistic Process"
    const isDisqualified = (totalAs === 0 || u >= 2 || d >= 4);

    if (!isDisqualified) {
      rules.forEach(rule => {
        if (rule.Student_Type && rule.Student_Type !== "Any") {
          if (isInternal && rule.Student_Type === "External") return;
          if (!isInternal && rule.Student_Type === "Internal") return;
        }

        if (rule.Model === 'Quantitative') {
          const reqTotal = parseInt(rule.Min_Total_As) || 0;
          const reqAStars = parseInt(rule.Min_A_Stars) || 0;
          const reqPoints = parseInt(rule.Min_Points) || 0;
          
          if (reqTotal === 0 && reqAStars === 0 && reqPoints === 0) {
            holisticNotes.push(rule);
          } else {
            usesQuant = true;
            if (totalAs >= reqTotal && aStar >= reqAStars && sicasPoints >= reqPoints) {
              if (!matchedQuant) {
                matchedQuant = rule;
              } else {
                const currReqTotal = parseInt(matchedQuant.Min_Total_As) || 0;
                const currReqPoints = parseInt(matchedQuant.Min_Points) || 0;
                if (reqTotal > currReqTotal || reqPoints > currReqPoints) {
                  matchedQuant = rule;
                }
              }
            }
          }
        } else if (rule.Model === 'Holistic') {
          holisticNotes.push(rule);
        }
      });
    }

    const resultsArea = document.getElementById('resultsArea');
    resultsArea.innerHTML = '';
    resultsArea.style.display = 'block';

    let html = '';

    // 1. Generate Main Result Card
    if (isDisqualified) {
      html += `
        <div class="result-card fail">
          <div class="result-title">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>
            Not Eligible
          </div>
          <p class="result-desc">Merit scholarships are strictly for high achievers. With 0 A's or multiple low/failing grades, you do not meet the minimum academic baseline for a scholarship.</p>
        </div>
      `;
    } else if (usesQuant) {
      if (matchedQuant) {
        html += `
          <div class="result-card success">
            <div class="result-title">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
              Eligible
              <span class="result-badge">${matchedQuant.Tier}</span>
            </div>
            <p class="result-desc"><strong>Conditions:</strong> ${matchedQuant.Conditions}</p>
          </div>
        `;
      } else {
        html += `
          <div class="result-card fail">
            <div class="result-title">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>
              Not Eligible
            </div>
            <p class="result-desc">Based on your inputted grades, you do not meet the minimum requirements for a guaranteed merit scholarship here.</p>
          </div>
        `;
      }
    }

    // Only show Holistic Process cards if they actually met the academic baseline
    if (!isDisqualified && holisticNotes.length > 0) {
      holisticNotes.forEach(rule => {
        html += `
          <div class="result-card info">
            <div class="result-title">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
              Process
              <span class="result-badge">${rule.Tier}</span>
            </div>
            <p class="result-desc"><strong>Details:</strong> ${rule.Conditions}</p>
          </div>
        `;
      });
    }

    // 2. Generate the "All Criteria" Table
    if (rules.length > 0) {
      html += `
        <div class="criteria-table-wrapper">
          <h3>Full Eligibility Criteria for ${college}</h3>
          <table class="criteria-table">
            <thead>
              <tr>
                <th>Award / Tier</th>
                <th>Requirements</th>
                <th>Conditions</th>
              </tr>
            </thead>
            <tbody>
      `;
      
      const sortedRules = [...rules].sort((a, b) => parseInt(b.Min_Total_As) - parseInt(a.Min_Total_As));

      sortedRules.forEach(r => {
        let reqText = [];
        if (r.Model === 'Holistic') {
          reqText.push("Holistic Evaluation");
        } else {
          if (parseInt(r.Min_Total_As) > 0) reqText.push(`Min ${r.Min_Total_As} A's (Total)`);
          if (parseInt(r.Min_A_Stars) > 0) reqText.push(`Min ${r.Min_A_Stars} A*'s`);
          if (parseInt(r.Min_Points) > 0) reqText.push(`Min ${r.Min_Points} Points`);
          if (r.Student_Type !== "Any") reqText.push(`${r.Student_Type} Students Only`);
          if (reqText.length === 0) reqText.push("See conditions");
        }

        html += `
          <tr>
            <td><strong>${r.Tier}</strong></td>
            <td>${reqText.join('<br>')}</td>
            <td>${r.Conditions}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;
    }

    // 3. Add the "Pro Tips" Alert Box
    html += `
      <div class="pro-tips-card">
        <div class="pro-tips-title">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#FE6100"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          Important Rules You Must Know
        </div>
        <ul class="pro-tips-list">
          <li><strong>Scholarships are NOT permanent:</strong> Top colleges (Nixor, Cedar, LGS, etc.) require you to maintain 90-95% attendance and a 'B' grade average in A1 to keep your scholarship for A2.</li>
          <li><strong>"100% Free" means Tuition Only:</strong> A 100% scholarship only covers tuition fees. You will still have to pay admission fees, security deposits, lab charges, and monthly administrative fees (e.g., Alpha College).</li>
          <li><strong>Apply Early:</strong> Scholarship funds are limited. Applying in Early Admission rounds (Round 1) gets you higher waivers for the same grades compared to applying in August.</li>
          <li><strong>Don't forget ECA & Siblings:</strong> National-level sports or debate records can get you massive Extracurricular (ECA) waivers. Also, schools like Cedar offer a flat 10% discount for siblings!</li>
        </ul>
      </div>
    `;

    resultsArea.innerHTML = html;
  }
</script>
